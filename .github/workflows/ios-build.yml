name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ver versiones
        run: |
          flutter --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Encontrar proyecto Flutter
        run: |
          PUBSPEC=$(find . -name pubspec.yaml -not -path "*/build/*" | head -1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: No se encontro pubspec.yaml"
            exit 1
          fi

          FLUTTER_DIR=$(dirname "$PUBSPEC")

          echo "Proyecto Flutter encontrado en: $FLUTTER_DIR"
          echo "FLUTTER_DIR=$FLUTTER_DIR" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          cd "$FLUTTER_DIR"
          flutter pub get

      - name: Instalar CocoaPods
        run: |
          cd "$FLUTTER_DIR/ios"
          pod install --repo-update

      - name: Compilar iOS
        run: |
          cd "$FLUTTER_DIR"
          flutter build ios --release --no-codesign

      - name: Crear IPA
        run: |
          rm -rf Payload
          mkdir Payload

          cp -R "$FLUTTER_DIR/build/ios/iphoneos/Runner.app" Payload/Runner.app

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            AppBichos-unsigned.ipa

      - name: Verificar IPA
        run: |
          unzip -l AppBichos-unsigned.ipa | head -60

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppBichos-iOS
          path: AppBichos-unsigned.ipa
          retention-days: 7